<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a0f 0%, #2d1b2e 40%, #1a0a12 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            position: relative;
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 105, 180, 0.35);
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 182, 193, 0.25);
            border-radius: 28px;
            padding: 48px 36px;
            max-width: 420px;
            width: 92%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4),
                        0 0 40px rgba(255, 105, 180, 0.15);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card.success {
            background: rgba(255, 240, 245, 0.12);
            border-color: rgba(255, 105, 180, 0.5);
            box-shadow: 0 25px 60px rgba(255, 20, 147, 0.3),
                        0 0 80px rgba(255, 105, 180, 0.25);
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.7rem;
            color: #ffb6c1;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 32px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .question {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 28px;
            color: #fff;
            line-height: 1.4;
        }

        /* Input field */
        .input-wrap {
            position: relative;
            margin-bottom: 24px;
        }

        .answer-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.09);
            border: 1.5px solid rgba(255, 182, 193, 0.35);
            border-radius: 50px;
            padding: 16px 22px;
            font-size: 1.1rem;
            color: #fff;
            outline: none;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            caret-color: #ff69b4;
        }

        .answer-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
        }

        .answer-input:focus {
            border-color: #ff69b4;
            background: rgba(255, 105, 180, 0.12);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.25);
        }

        .answer-input.error {
            border-color: #ff6b6b;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 22px;
            font-weight: 300;
        }

        .btn {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: none;
            border-radius: 50px;
            padding: 15px 48px;
            font-size: 1.1rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.4);
            letter-spacing: 0.5px;
            font-family: 'Montserrat', sans-serif;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 20, 147, 0.55);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Success screen */
        .success-content {
            display: none;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .success-content.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .big-heart {
            font-size: 4.5rem;
            animation: heartbeat 1.2s ease-in-out infinite;
            margin-bottom: 16px;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }

        .love-message {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #ffb6c1;
            line-height: 1.3;
            margin-bottom: 18px;
            text-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
        }

        .love-sub {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            line-height: 1.6;
        }

        /* Explosion */
        .explosion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .explode-heart {
            position: absolute;
            font-size: 28px;
            animation: explode 1.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.3) rotate(0deg);
            }
            30% { opacity: 1; }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot));
            }
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: particleFly 2s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--px), var(--py)) scale(0);
            }
        }

        .question-block.hide {
            display: none;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card {
            animation: cardAppear 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 22px;
            }
            .title {
                font-size: 2.3rem;
            }
            .love-message {
                font-size: 2rem;
            }
            .question {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsBg"></div>
    <div class="explosion" id="explosion"></div>

    <div class="card" id="card">
        <div class="question-block" id="questionBlock">
            <div class="title">Для тебя</div>
            <div class="subtitle">маленькое простое сердце</div>
            
            <div class="question">Сколько мы вместе?</div>
            
            <div class="input-wrap">
                <input 
                    type="text" 
                    class="answer-input" 
                    id="answerInput" 
                    placeholder="напиши ответ..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
            </div>

            <div class="hint">можно просто «год» или «365 дней»</div>
            
            <button class="btn" id="submitBtn">Готово ❤️</button>
        </div>

        <div class="success-content" id="successContent">
            <div class="big-heart">❤️</div>
            <div class="love-message">Я тебя очень<br>сильно люблю</div>
            <div class="love-sub">и хочу быть с тобой<br>навсегда ✨</div>
        </div>
    </div>

    <script>
        // Floating hearts
        const heartsBg = document.getElementById('heartsBg');
        const heartSymbols = ['❤️', '💕', '💗', '💖', '💓', '💘', '💝'];

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (16 + Math.random() * 22) + 'px';
            heart.style.animationDuration = (8 + Math.random() * 12) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heartsBg.appendChild(heart);
            setTimeout(() => heart.remove(), 20000);
        }

        for (let i = 0; i < 18; i++) {
            setTimeout(createFloatingHeart, i * 400);
        }
        setInterval(createFloatingHeart, 900);

        // Elements
        const input = document.getElementById('answerInput');
        const submitBtn = document.getElementById('submitBtn');

        // Correct answers (normalized)
        function isCorrect(answer) {
            const text = answer.toLowerCase().trim()
                .replace(/\s+/g, ' ')
                .replace(/ё/g, 'е');

            const correctList = [
                'год',
                '1 год',
                'один год',
                '1год',
                '365',
                '365 дней',
                '365дней',
                'триста шестьдесят пять дней',
                'год вместе',
                'один годик'
            ];

            return correctList.some(item => text === item || text.includes(item));
        }

        function checkAnswer() {
            const value = input.value.trim();
            if (!value) {
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 500);
                return;
            }

            if (isCorrect(value)) {
                // Success
                input.disabled = true;
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.6';

                setTimeout(() => {
                    explodeHearts();
                    document.getElementById('questionBlock').classList.add('hide');
                    document.getElementById('card').classList.add('success');
                    
                    const success = document.getElementById('successContent');
                    success.classList.add('show');
                }, 400);
            } else {
                // Wrong answer — shake
                input.classList.add('error');
                setTimeout(() => {
                    input.classList.remove('error');
                    input.select();
                }, 500);
            }
        }

        // Events
        submitBtn.addEventListener('click', checkAnswer);
        
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Focus input on load
        setTimeout(() => input.focus(), 600);

        // Heart explosion
        function explodeHearts() {
            const explosion = document.getElementById('explosion');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for (let i = 0; i < 50; i++) {
                const heart = document.createElement('div');
                heart.className = 'explode-heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = centerX + 'px';
                heart.style.top = centerY + 'px';
                
                const angle = (Math.PI * 2 * i) / 50 + (Math.random() - 0.5) * 0.6;
                const distance = 130 + Math.random() * 300;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 90;
                const rot = (Math.random() - 0.5) * 720;

                heart.style.setProperty('--tx', tx + 'px');
                heart.style.setProperty('--ty', ty + 'px');
                heart.style.setProperty('--rot', rot + 'deg');
                heart.style.fontSize = (22 + Math.random() * 30) + 'px';
                heart.style.animationDelay = (Math.random() * 0.35) + 's';

                explosion.appendChild(heart);
                setTimeout(() => heart.remove(), 2100);
            }

            // Particles
            const colors = ['#ff69b4', '#ff1493', '#ffb6c1', '#ff85a2', '#ffc0cb', '#fff'];
            for (let i = 0; i < 70; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = centerX + 'px';
                p.style.top = centerY + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const dist = 90 + Math.random() * 250;
                p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
                p.style.animationDelay = (Math.random() * 0.4) + 's';

                explosion.appendChild(p);
                setTimeout(() => p.remove(), 2300);
            }
        }
    </script>
</body>
</html>
